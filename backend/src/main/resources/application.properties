# ==============================================================
# ATTENDANCE MANAGEMENT SYSTEM - SPRING BOOT CONFIGURATION (DEFAULT / H2)
# ==============================================================
spring.application.name=attendance-backend
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:attendancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at /h2-console for local development & diagnostics)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Min 256 bits secret for HMAC-SHA256)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Cross-Origin Resource Sharing (CORS) Configuration
# Comma-separated list of origins allowed, overridable via CORS_ALLOWED_ORIGINS env variable
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.attendance=INFO
